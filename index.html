<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تذكر الأزواج</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0b1a2e, #1a2f44);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 20px 90px;
        }
        .game-wrapper {
            background: #1e3a5f;
            padding: 25px 20px 30px;
            border-radius: 40px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.7);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #facc15;
            font-size: 26px;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .sub-title {
            color: #94b8d9;
            font-size: 14px;
            margin-bottom: 18px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #0f2a44;
            padding: 12px 5px;
            border-radius: 50px;
            margin-bottom: 18px;
            color: #dfe9f3;
            font-weight: 600;
            font-size: 16px;
        }
        .stats span {
            color: #facc15;
            font-size: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 18px 0 20px;
        }
        .card {
            aspect-ratio: 1 / 1;
            background: #facc15;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #0b1a2e;
            cursor: pointer;
            box-shadow: 0 6px 0 #b9910e, 0 8px 15px rgba(0,0,0,0.3);
            transition: 0.15s;
            user-select: none;
        }
        .card.flipped, .card.matched {
            background: #2d4f78;
            box-shadow: 0 4px 0 #1a3452;
            color: white;
            cursor: default;
        }
        .card.matched {
            background: #2b7a4b;
            box-shadow: 0 4px 0 #1a5332;
        }
        .card:active:not(.flipped):not(.matched) {
            transform: scale(0.94);
        }
        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            gap: 10px;
        }
        .best-result {
            background: #0f2a44;
            padding: 8px 18px;
            border-radius: 40px;
            color: #facc15;
            font-weight: bold;
            font-size: 18px;
        }
        .reset-btn {
            background: #facc15;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 17px;
            color: #0b1a2e;
            cursor: pointer;
            box-shadow: 0 5px 0 #b9910e;
            transition: 0.1s;
        }
        .reset-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b9910e;
        }

        /* ===== الإعلان السفلي ===== */
        #ad-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            background: #0f2a44;
            padding: 12px 0;
            z-index: 9999;
            border-top: 3px solid #facc15;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.6);
        }
        #ad-bottom a {
            font-size: 20px;
            font-weight: bold;
            color: #facc15;
            text-decoration: none;
            background: #1e3a5f;
            padding: 8px 32px;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid #facc15;
            transition: 0.2s;
        }
        #ad-bottom a:hover {
            background: #facc15;
            color: #0b1a2e;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <h1>🧠 تذكر الأزواج</h1>
    <p class="sub-title">أوجد الأزواج المتطابقة</p>

    <div class="stats">
        <div>🔄 المحاولات <br><span id="attempts">0</span></div>
        <div>⏱️ الوقت <br><span id="timer">0</span>s</div>
        <div>🏆 أفضل <br><span id="best">-</span></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="bottom-row">
        <div class="best-result">⭐ أفضل نتيجة: <span id="bestResult">-</span></div>
        <button class="reset-btn" id="resetBtn">🔁 إعادة التشغيل</button>
    </div>
</div>

<!-- ===== الإعلان السفلي الوحيد ===== -->
<div id="ad-bottom">
    <a href="https://رابط-مكافاتك.com" target="_blank">🎁 احصل على مكافآتك! 😊</a>
</div>

<script>
    (function() {
        // الأرقام (8 أزواج)
        const PAIRS = [1, 2, 3, 4, 5, 6, 7, 8];
        let cards = [];
        let flippedIndices = [];
        let matchedPairs = 0;
        let attempts = 0;
        let timer = 0;
        let timerInterval = null;
        let isLocked = false;
        let best = localStorage.getItem('memoryBest') || null;

        const gridEl = document.getElementById('grid');
        const attemptsEl = document.getElementById('attempts');
        const timerEl = document.getElementById('timer');
        const bestEl = document.getElementById('best');
        const bestResultEl = document.getElementById('bestResult');

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initGame() {
            // إيقاف المؤقت القديم
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timer = 0;
            timerEl.textContent = '0';
            attempts = 0;
            attemptsEl.textContent = '0';
            matchedPairs = 0;
            flippedIndices = [];
            isLocked = false;
            if (best) {
                bestEl.textContent = best;
                bestResultEl.textContent = best;
            } else {
                bestEl.textContent = '-';
                bestResultEl.textContent = '-';
            }

            // تحضير البطاقات
            let deck = [...PAIRS, ...PAIRS];
            deck = shuffle(deck);
            cards = deck.map((value, index) => ({
                id: index,
                value: value,
                flipped: false,
                matched: false
            }));

            renderGrid();
        }

        function renderGrid() {
            gridEl.innerHTML = '';
            cards.forEach((card, index) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.dataset.index = index;
                if (card.flipped || card.matched) {
                    div.classList.add('flipped');
                    div.textContent = card.value;
                    if (card.matched) div.classList.add('matched');
                } else {
                    div.textContent = '?';
                }
                div.addEventListener('click', () => onCardClick(index));
                gridEl.appendChild(div);
            });
        }

        function onCardClick(index) {
            if (isLocked) return;
            const card = cards[index];
            if (card.flipped || card.matched) return;
            if (flippedIndices.length === 2) return;

            // بدء المؤقت عند أول نقرة
            if (!timerInterval && matchedPairs === 0) {
                timerInterval = setInterval(() => {
                    timer++;
                    timerEl.textContent = timer;
                }, 1000);
            }

            // قلب البطاقة
            card.flipped = true;
            flippedIndices.push(index);
            renderGrid();

            if (flippedIndices.length === 2) {
                attempts++;
                attemptsEl.textContent = attempts;
                isLocked = true;

                const idx1 = flippedIndices[0];
                const idx2 = flippedIndices[1];
                const val1 = cards[idx1].value;
                const val2 = cards[idx2].value;

                if (val1 === val2) {
                    cards[idx1].matched = true;
                    cards[idx2].matched = true;
                    matchedPairs++;
                    flippedIndices = [];
                    isLocked = false;
                    renderGrid();

                    if (matchedPairs === PAIRS.length) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        // تحديث أفضل نتيجة
                        if (best === null || attempts < best) {
                            best = attempts;
                            localStorage.setItem('memoryBest', best);
                            bestEl.textContent = best;
                            bestResultEl.textContent = best;
                        }
                    }
                } else {
                    // إعادة الإخفاء بعد نصف ثانية
                    setTimeout(() => {
                        cards[idx1].flipped = false;
                        cards[idx2].flipped = false;
                        flippedIndices = [];
                        isLocked = false;
                        renderGrid();
                    }, 500);
                }
            }
        }

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            initGame();
        });

        // بدء اللعبة
        initGame();
    })();
</script>

</body>
</html>
