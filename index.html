<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الأرقام - Memory Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tahoma', sans-serif;
        }
        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 20px 80px;
        }
        .game-container {
            background: #1e293b;
            padding: 30px 25px;
            border-radius: 28px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            max-width: 500px;
            width: 100%;
            text-align: center;
            color: #f1f5f9;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #facc15;
        }
        .sub {
            margin-bottom: 20px;
            color: #94a3b8;
            font-size: 15px;
        }
        .number-box {
            background: #0f172a;
            padding: 30px 10px;
            border-radius: 20px;
            margin: 15px 0 20px;
            font-size: 64px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 4px;
            border: 2px dashed #334155;
        }
        .input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        input {
            flex: 1;
            min-width: 140px;
            padding: 14px 16px;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            text-align: center;
            background: #0f172a;
            color: #f8fafc;
            outline: 2px solid #334155;
            transition: 0.2s;
        }
        input:focus {
            outline-color: #facc15;
        }
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            background: #facc15;
            color: #0f172a;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 0 #b9910e;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b9910e;
        }
        .message {
            margin: 18px 0 10px;
            font-size: 20px;
            min-height: 40px;
            font-weight: 500;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 14px 8px;
            border-radius: 40px;
            margin-top: 25px;
            font-size: 15px;
            color: #cbd5e1;
        }
        .stats span {
            color: #facc15;
            font-weight: bold;
        }
        .reset-btn {
            background: #475569;
            color: #f1f5f9;
            box-shadow: 0 5px 0 #1e293b;
            margin-top: 12px;
            padding: 12px 32px;
        }

        /* ===== الإعلان السفلي الوحيد ===== */
        #ad-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            background: #1e293b;
            padding: 12px 0;
            z-index: 9999;
            border-top: 3px solid #facc15;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }
        #ad-bottom a {
            font-size: 20px;
            font-weight: bold;
            color: #facc15;
            text-decoration: none;
            background: #0f172a;
            padding: 8px 30px;
            border-radius: 40px;
            display: inline-block;
            transition: 0.2s;
            border: 1px solid #facc15;
        }
        #ad-bottom a:hover {
            background: #facc15;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🔢 خمن الرقم</h1>
        <p class="sub">أدخل رقمًا بين 1 و 100</p>

        <div class="number-box" id="guessDisplay">??</div>

        <div class="input-area">
            <input type="number" id="guessInput" placeholder="رقمك..." min="1" max="100">
            <button id="guessBtn">✅ تخمين</button>
        </div>

        <div class="message" id="message">🟡 ابدأ اللعب!</div>

        <div class="stats">
            <div>🔄 محاولات: <span id="attempts">0</span></div>
            <div>🎯 أفضل: <span id="bestScore">-</span></div>
        </div>

        <button class="reset-btn" id="resetBtn">🔄 لعبة جديدة</button>
    </div>

    <!-- ===== الإعلان السفلي الوحيد (احصل على جائزتك) ===== -->
    <div id="ad-bottom">
        <a href="https://رابط-جائزتك.com" target="_blank">🎁 احصل على جائزتك</a>
    </div>

    <script>
        (function() {
            let secret = Math.floor(Math.random() * 100) + 1;
            let attempts = 0;
            let best = localStorage.getItem('bestMemoryGame') || null;

            const guessDisplay = document.getElementById('guessDisplay');
            const guessInput = document.getElementById('guessInput');
            const guessBtn = document.getElementById('guessBtn');
            const message = document.getElementById('message');
            const attemptsSpan = document.getElementById('attempts');
            const bestSpan = document.getElementById('bestScore');

            function updateUI() {
                attemptsSpan.textContent = attempts;
                bestSpan.textContent = best ? best : '-';
            }
            if (best) bestSpan.textContent = best;

            function resetGame() {
                secret = Math.floor(Math.random() * 100) + 1;
                attempts = 0;
                guessDisplay.textContent = '??';
                message.innerHTML = '🟡 لعبة جديدة! ابدأ التخمين';
                guessInput.value = '';
                guessInput.disabled = false;
                guessBtn.disabled = false;
                updateUI();
            }

            function checkGuess() {
                const raw = guessInput.value.trim();
                if (raw === '') {
                    message.innerHTML = '⚠️ أدخل رقمًا أولاً';
                    return;
                }
                const guess = Number(raw);
                if (isNaN(guess) || guess < 1 || guess > 100) {
                    message.innerHTML = '❌ الرقم يجب أن يكون بين 1 و 100';
                    return;
                }

                attempts++;
                if (guess === secret) {
                    message.innerHTML = `🎉 صحيح! الرقم هو ${secret}`;
                    guessDisplay.textContent = secret;
                    guessInput.disabled = true;
                    guessBtn.disabled = true;
                    if (best === null || attempts < best) {
                        best = attempts;
                        localStorage.setItem('bestMemoryGame', best);
                    }
                    updateUI();
                    return;
                } else if (guess < secret) {
                    message.innerHTML = '⬆️ الرقم أكبر من ذلك';
                    guessDisplay.textContent = '⬆️';
                } else {
                    message.innerHTML = '⬇️ الرقم أصغر من ذلك';
                    guessDisplay.textContent = '⬇️';
                }
                guessInput.value = '';
                guessInput.focus();
                updateUI();
            }

            guessBtn.addEventListener('click', checkGuess);
            guessInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') checkGuess();
            });
            document.getElementById('resetBtn').addEventListener('click', resetGame);

            // بداية
            resetGame();
        })();
    </script>

</body>
</html>
